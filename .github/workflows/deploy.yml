name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Build Go binary
        run: |
          mkdir -p bin
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/smarthub-server ./cmd/api
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: bin/smarthub-server
          retention-days: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy frontend
        run: |
          rsync -avz --delete --rsync-path="sudo rsync" -e "ssh -i ~/.ssh/deploy_key" artifacts/frontend-dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/smarthub.logikraf.id/
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo chown -R www:www /www/wwwroot/smarthub.logikraf.id && echo 'frontend OK'"
      - name: Deploy Go binary & restart
        run: |
          rsync -avz --chmod=F755 --rsync-path="sudo rsync" -e "ssh -i ~/.ssh/deploy_key" artifacts/go-binary/smarthub-server ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/usr/local/bin/smarthub-server
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo systemctl restart smarthub && sleep 2 && systemctl is-active smarthub"
      - name: Health check
        run: |
          sleep 3
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://smarthub.logikraf.id/ || true)
          echo "smarthub.logikraf.id -> $code"
          test "$code" = "200" && echo "Deployment successful!" || exit 1
